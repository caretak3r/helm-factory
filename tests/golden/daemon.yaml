# Source: daemon/templates/app.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: t-daemon
  namespace: default
  labels:
    helm.sh/chart: daemon-0.1.0
    app.kubernetes.io/name: daemon
    app.kubernetes.io/instance: t
    app.kubernetes.io/component: app
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: daemon
      app.kubernetes.io/instance: t
      app.kubernetes.io/component: app
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daemon
        app.kubernetes.io/instance: t
        app.kubernetes.io/component: app
    spec:
      serviceAccountName: t-daemon
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - command:
          - sh
          - -c
          - echo init
          image: docker.io/library/busybox:1.36.1
          imagePullPolicy: IfNotPresent
          name: init-wait
          resizePolicy:
          - resourceName: cpu
            restartPolicy: NotRequired
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
          - mountPath: /etc/platform-tls/server
            name: mtls-server
            readOnly: true
          - mountPath: /etc/platform-tls/client-worker
            name: mtls-client-worker
            readOnly: true
          - mountPath: /etc/platform-tls/client-reader
            name: mtls-client-reader
            readOnly: true
          - mountPath: /etc/platform-tls/ca
            name: mtls-ca-bundle
            readOnly: true
      containers:
        - name: daemon
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          image: docker.io/example/daemon:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: RestartContainer
          volumeMounts:
            - mountPath: /etc/platform-tls/server
              name: mtls-server
              readOnly: true
            - mountPath: /etc/platform-tls/client-worker
              name: mtls-client-worker
              readOnly: true
            - mountPath: /etc/platform-tls/client-reader
              name: mtls-client-reader
              readOnly: true
            - mountPath: /etc/platform-tls/ca
              name: mtls-ca-bundle
              readOnly: true
        - command:
          - sh
          - -c
          - sleep infinity
          image: docker.io/library/busybox:1.36.1
          imagePullPolicy: IfNotPresent
          name: metrics-proxy
          resizePolicy:
          - resourceName: memory
            restartPolicy: RestartContainer
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
          - mountPath: /etc/platform-tls/server
            name: mtls-server
            readOnly: true
          - mountPath: /etc/platform-tls/client-worker
            name: mtls-client-worker
            readOnly: true
          - mountPath: /etc/platform-tls/client-reader
            name: mtls-client-reader
            readOnly: true
          - mountPath: /etc/platform-tls/ca
            name: mtls-ca-bundle
            readOnly: true
        - command:
          - sh
          - -c
          - sleep infinity
          image: docker.io/library/busybox:1.36.1
          imagePullPolicy: IfNotPresent
          name: log-shipper
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
          - mountPath: /etc/platform-tls/server
            name: mtls-server
            readOnly: true
          - mountPath: /etc/platform-tls/client-worker
            name: mtls-client-worker
            readOnly: true
          - mountPath: /etc/platform-tls/client-reader
            name: mtls-client-reader
            readOnly: true
          - mountPath: /etc/platform-tls/ca
            name: mtls-ca-bundle
            readOnly: true
      volumes:
        - name: mtls-server
          secret:
            defaultMode: 256
            secretName: t-daemon-tls
        - name: mtls-client-worker
          secret:
            defaultMode: 256
            secretName: t-daemon-mtls-client-worker
        - name: mtls-client-reader
          secret:
            defaultMode: 256
            secretName: t-daemon-mtls-client-reader
        - configMap:
            defaultMode: 292
            name: t-daemon-ca-bundle
          name: mtls-ca-bundle
      nodeSelector:
        kubernetes.io/os: "linux"
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      terminationGracePeriodSeconds: 30
      restartPolicy: Always
