  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 200
  suspend: false
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: full
            app.kubernetes.io/instance: t
            app.kubernetes.io/component: cronjob
          annotations:
            cron-summary: "Job {{ $labels.job }} failed"
            platform.example/cron-pod: "default"
        spec:
          serviceAccountName: t-full
          automountServiceAccountToken: true
          enableServiceLinks: false
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1001
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: full-cron
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1001
                seccompProfile:
                  type: RuntimeDefault
              image: docker.io/example/app:1.2.3
              imagePullPolicy: IfNotPresent
              resources:
                limits:
                  cpu: 500m
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
