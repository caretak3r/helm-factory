apiVersion: apps/v1
kind: Deployment
metadata:
  name: t-full
  namespace: default
  labels:
    helm.sh/chart: full-0.1.0
    app.kubernetes.io/name: full
    app.kubernetes.io/instance: t
    app.kubernetes.io/component: app
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    platform.example/release: "t"
    shadow-test: "t-common"
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: full
      app.kubernetes.io/instance: t
      app.kubernetes.io/component: app
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: full
        app.kubernetes.io/instance: t
        app.kubernetes.io/component: app
      annotations:
        checksum/config: "b194670b7037f72fb1c66e9ccaf12cfa52826ec0434add18e3cba1f056c1a9a7"
        platform.example/release: "t"
        shadow-test: "literal-wins"
        summary: "Pod {{ $labels.pod }} down"
        vault.example/role: "t-app"
    spec:
      serviceAccountName: t-full
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        fsGroup: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: full
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          image: docker.io/example/app:1.2.3
          imagePullPolicy: IfNotPresent
          env:
            
            - name: NAMESPACE
              value: "default"
            - name: PLAIN
              value: "literal-value"
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: RestartContainer
          volumeMounts:
            - mountPath: /app/config
              name: config
            - mountPath: /etc/webhook-tls
              name: webhook-tls
              readOnly: true
      volumes:
        - configMap:
            name: t-full-config
          name: config
        - name: webhook-tls
          secret:
            defaultMode: 256
            secretName: t-full-webhook-cert
      terminationGracePeriodSeconds: 30
      restartPolicy: Always
      runtimeClassName: "gvisor"
      dnsPolicy: "ClusterFirst"
      dnsConfig:
        nameservers:
        - 10.0.0.10
        options:
        - name: ndots
          value: "5"
        searches:
        - ns1.svc.cluster.local
      shareProcessNamespace: true
      os:
        name: linux
