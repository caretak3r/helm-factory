apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: t-full
  namespace: default
  labels:
    helm.sh/chart: full-0.1.0
    app.kubernetes.io/name: full
    app.kubernetes.io/instance: t
    app.kubernetes.io/component: app
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    platform.example/sm-owner: "t-sm"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: full
      app.kubernetes.io/instance: t
      app.kubernetes.io/component: app
    matchExpressions:
      - key: platform/service-role
        operator: NotIn
        values:
          - headless
  namespaceSelector:
    matchNames:
      - "default"
  endpoints:
    - port: "http"
      path: "/metrics"
