# Full-coverage overrides. Values land at root because the dependency uses
# import-values: [defaults]. Force-assume the CRD groups so the gated objects
# render under `helm template` (no cluster).
image:
  repository: example/app
  tag: "1.2.3"

# Pod-spec long-tail fields: exercised across the workload, CronJob, and
# preinstall hook Job pod specs (all three share this fixture's values).
runtimeClassName: gvisor
dnsPolicy: ClusterFirst
dnsConfig:
  nameservers:
    - 10.0.0.10
  searches:
    - ns1.svc.cluster.local
  options:
    - name: ndots
      value: "5"
shareProcessNamespace: true
os:
  name: linux

configMap:
  enabled: true
  mounted: true
  data:
    app.properties: |
      mode=full

service:
  enabled: true
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  trafficDistribution: PreferClose
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4

ingress:
  enabled: true
  hostname: app.example.com

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPU: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow

networkPolicy:
  enabled: true

serviceAccount:
  create: true

cronJob:
  enabled: true
  schedule: "*/5 * * * *"

# In-place pod vertical scaling: verbatim container resizePolicy passthrough.
resizePolicy:
  - resourceName: cpu
    restartPolicy: NotRequired
  - resourceName: memory
    restartPolicy: RestartContainer

certificate:
  enabled: true
  issuer: letsencrypt
  dnsNames:
    - app.example.com

mtls:
  enabled: true
  policy: STRICT
  # Fail-closed: principals are now required. Same-namespace default (release
  # renders into "default" under helm template).
  allowedPrincipals:
    - "cluster.local/ns/default/sa/*"

serviceMonitor:
  enabled: true

podMonitor:
  enabled: true

gatewayApi:
  enabled: true
  hostnames:
    - app.example.com
  parentRefs:
    - name: shared-gateway
      namespace: gateway-system
  httpRoute:
    enabled: true
    hostnames:
      - app.example.com
    parentRefs:
      - name: shared-gateway
        namespace: gateway-system

capabilities:
  apiVersions:
    - gateway.networking.k8s.io/v1
    - cert-manager.io/v1
    - security.istio.io/v1beta1
    - monitoring.coreos.com/v1

# The fixture ships ClusterRole/PriorityClass extras, so opt in to the
# cluster-scoped gate (default false; the lint gate has a negative test that
# flips this back off and expects a failure naming ClusterRole).
allowClusterScopedExtras: true

# Tier-2 long tail: capability-negotiated, standard-labelled, namespace-aware.
extraObjects:
  Role:
    - name: app-reader
      rules:
        - apiGroups: [""]
          resources: ["configmaps", "secrets"]
          verbs: ["get", "list", "watch"]
  RoleBinding:
    - name: app-reader-binding
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: app-reader
      subjects:
        - kind: ServiceAccount
          name: full-platform
  ServiceAccount:
    - name: extra-sa
      automountServiceAccountToken: false
  ClusterRole:
    - name: full-cluster-reader
      rules:
        - apiGroups: [""]
          resources: ["nodes"]
          verbs: ["get", "list"]
  PriorityClass:
    - name: full-high
      value: 1000000
      globalDefault: false
      description: "High priority for the app"
  ResourceQuota:
    - name: full-quota
      spec:
        hard:
          pods: "10"
  ConfigMap:
    - name: extra-config
      data:
        key: value

# Ultimate escape hatch.
extraManifests:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: raw-config
    data:
      raw: "true"

# Hook job, exercises the hardened renderHookJob path (securityContext,
# automountServiceAccountToken, enableServiceLinks, script ConfigMap).
# jobs.resizePolicy is the shared default consumed by both the hook Job main
# container below and the CronJob fallback container above.
jobs:
  resizePolicy:
    - resourceName: cpu
      restartPolicy: NotRequired
  preInstall:
    enabled: true
    script: |
      #!/bin/sh
      echo "pre-install hook"
