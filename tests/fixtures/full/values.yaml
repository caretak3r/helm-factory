# Full-coverage overrides. Values land at root because the dependency uses
# import-values: [defaults]. Force-assume the CRD groups so the gated objects
# render under `helm template` (no cluster).
image:
  repository: example/app
  tag: "1.2.3"

# Pod-spec long-tail fields: exercised across the workload, CronJob, and
# preinstall hook Job pod specs (all three share this fixture's values).
runtimeClassName: gvisor
dnsPolicy: ClusterFirst
dnsConfig:
  nameservers:
    - 10.0.0.10
  searches:
    - ns1.svc.cluster.local
  options:
    - name: ndots
      value: "5"
shareProcessNamespace: true
os:
  name: linux

configMap:
  enabled: true
  mounted: true
  data:
    app.properties: |
      mode=full

service:
  enabled: true
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  trafficDistribution: PreferClose
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4

generatedSecrets:
  - name: admin
    keys:
      - key: password
        kind: password
      - key: auth
        kind: htpasswd
        username: admin
        passwordFrom: password

ingress:
  enabled: true
  hostname: app.example.com

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPU: 80
  # The advanced HPA branches (behavior, targetMemory, custom metrics) are all
  # gated separately in platform.autoscaling; a CPU-only fixture froze none of
  # them into a golden.
  targetMemory: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 4
          periodSeconds: 15
  metrics:
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "1k"

# updateMode: Off (recommend-only) so this coexists with autoscaling.enabled
# above without tripping the HPA/VPA conflict guard.
verticalAutoscaling:
  enabled: true
  updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed:
          cpu: 50m
          memory: 64Mi
        maxAllowed:
          cpu: "1"
          memory: 512Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow

# Populated ingress/egress rules: the default-deny shape (podSelector +
# policyTypes only) left _networkpolicy.yaml's rule branches unrendered.
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

resourceQuota:
  enabled: true
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"

limitRange:
  enabled: true
  default:
    cpu: 500m
    memory: 512Mi
  defaultRequest:
    cpu: 250m
    memory: 256Mi
  max:
    cpu: "2"
    memory: 2Gi
  min:
    cpu: 50m
    memory: 64Mi

serviceAccount:
  create: true
  # The Role below is useless without a token to present with it; the library
  # default is false, so an app that actually calls the API must opt in.
  automountServiceAccountToken: true

# Namespaced Role + RoleBinding for this chart's own ServiceAccount.
rbac:
  enabled: true
  rules:
    - apiGroups: [""]
      resources: ["configmaps"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps"]
      resources: ["deployments"]
      resourceNames: ["t-full"]
      verbs: ["get", "patch"]

cronJob:
  enabled: true
  schedule: "*/5 * * * *"

# In-place pod vertical scaling: verbatim container resizePolicy passthrough.
resizePolicy:
  - resourceName: cpu
    restartPolicy: NotRequired
  - resourceName: memory
    restartPolicy: RestartContainer

certificate:
  enabled: true
  issuer: letsencrypt
  dnsNames:
    - app.example.com

mtls:
  enabled: true
  policy: STRICT
  # Fail-closed: principals are now required. Same-namespace default (release
  # renders into "default" under helm template).
  allowedPrincipals:
    - "cluster.local/ns/default/sa/*"

# One validating + one mutating entry: exercises the webhook-cert Secret plus
# both cluster-scoped webhook Kinds. service.enabled=true above satisfies the
# webhooks.enabled fail-closed guard.
webhooks:
  enabled: true
  validating:
    - name: validate.app.example.com
      path: /validate
      rules:
        - apiGroups: [""]
          apiVersions: ["v1"]
          operations: ["CREATE", "UPDATE"]
          resources: ["pods"]
  mutating:
    - name: mutate.app.example.com
      path: /mutate
      rules:
        - apiGroups: [""]
          apiVersions: ["v1"]
          operations: ["CREATE"]
          resources: ["pods"]
      reinvocationPolicy: IfNeeded

serviceMonitor:
  enabled: true

podMonitor:
  enabled: true

prometheusRule:
  enabled: true
  groups:
    - name: app.rules
      rules:
        - alert: HighErrorRate
          expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: High error rate detected

gatewayApi:
  enabled: true
  hostnames:
    - app.example.com
  parentRefs:
    - name: shared-gateway
      namespace: gateway-system
  httpRoute:
    enabled: true
    hostnames:
      - app.example.com
    parentRefs:
      - name: shared-gateway
        namespace: gateway-system
  # GRPCRoute is a separate CRD negotiated on its own (HTTPRoute availability
  # does not prove it), and no fixture rendered it — ~80 lines of
  # _gateway-api.yaml were frozen into no golden. The force-assumed bare
  # gateway.networking.k8s.io/v1 below satisfies its registry entry too.
  grpcRoute:
    enabled: true
    hostnames:
      - grpc.example.com
    parentRefs:
      - name: shared-gateway
        namespace: gateway-system
    matches:
      - method:
          type: Exact
          service: com.example.Echo
          method: Ping

capabilities:
  apiVersions:
    - gateway.networking.k8s.io/v1
    - cert-manager.io/v1
    - security.istio.io/v1beta1
    - monitoring.coreos.com/v1
    - autoscaling.k8s.io/v1

# The fixture ships ClusterRole/PriorityClass extras, so opt in to the
# cluster-scoped gate (default false; the lint gate has a negative test that
# flips this back off and expects a failure naming ClusterRole).
allowClusterScopedExtras: true

# Tier-2 long tail: capability-negotiated, standard-labelled, namespace-aware.
extraObjects:
  Role:
    - name: app-reader
      rules:
        - apiGroups: [""]
          resources: ["configmaps", "secrets"]
          verbs: ["get", "list", "watch"]
  RoleBinding:
    - name: app-reader-binding
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: app-reader
      subjects:
        - kind: ServiceAccount
          name: full-platform
  ServiceAccount:
    - name: extra-sa
      automountServiceAccountToken: false
  ClusterRole:
    - name: full-cluster-reader
      rules:
        - apiGroups: [""]
          resources: ["nodes"]
          verbs: ["get", "list"]
  PriorityClass:
    - name: full-high
      value: 1000000
      globalDefault: false
      description: "High priority for the app"
  ResourceQuota:
    - name: full-quota
      spec:
        hard:
          pods: "10"
  ConfigMap:
    - name: extra-config
      data:
        key: value
    # template: true opt-in — whole entry tpl-expanded before rendering, so the
    # name and data value below resolve against release context.
    - name: '{{ include "platform.fullname" . }}-scripts'
      template: true
      data:
        ns: '{{ .Release.Namespace }}'

# Ultimate escape hatch.
extraManifests:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: raw-config
    data:
      raw: "true"

# Hook job, exercises the hardened renderHookJob path (securityContext,
# automountServiceAccountToken, enableServiceLinks, script ConfigMap).
# jobs.resizePolicy is the shared default consumed by both the hook Job main
# container below and the CronJob fallback container above.
jobs:
  resizePolicy:
    - resourceName: cpu
      restartPolicy: NotRequired
  preInstall:
    enabled: true
    script: |
      #!/bin/sh
      echo "pre-install hook"
