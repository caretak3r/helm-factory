# StatefulSet coverage fixture. Values land at root because the dependency
# uses import-values: [defaults]. Exercises: workload.type=StatefulSet,
# persistence (PVC + mount), mounted ConfigMap, Secret, all three probes,
# and statefulSet.volumeClaimTemplates, plus a ServiceMonitor over the
# StatefulSet's primary + managed headless Service pair (the double-match case).
workload:
  type: StatefulSet

image:
  repository: example/stateful
  tag: "1.0.0"

service:
  enabled: true
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  internalTrafficPolicy: Local
  publishNotReadyAddresses: true

configMap:
  enabled: true
  mounted: true
  data:
    app.properties: |
      mode=stateful

secret:
  enabled: true
  stringData:
    password: fixture-not-a-real-secret

persistence:
  enabled: true
  size: 1Gi

startupProbe:
  enabled: true

livenessProbe:
  enabled: true

readinessProbe:
  enabled: true

serviceMonitor:
  enabled: true

capabilities:
  apiVersions:
    - monitoring.coreos.com/v1

statefulSet:
  volumeClaimTemplates:
    - name: logs
      accessModes: ["ReadWriteOnce"]
      storage: 1Gi
