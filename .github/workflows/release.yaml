name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write # OIDC token for cosign keyless signing

jobs:
  release:
    name: gate, package, push to GHCR (OCI)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Versions and checksums come from scripts/lib/tool-versions.sh, shared with
      # ci.yaml. There is nothing left to keep in sync by hand.
      - name: Install helm
        run: |
          source scripts/lib/tool-versions.sh
          curl -fsSL -o /tmp/helm.tgz "$HELM_URL"
          echo "$HELM_SHA256_LINUX_AMD64  /tmp/helm.tgz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/helm.tgz
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Install kubeconform
        run: |
          source scripts/lib/tool-versions.sh
          curl -fsSL -o /tmp/kubeconform.tgz "$KUBECONFORM_URL"
          echo "$KUBECONFORM_SHA256_LINUX_AMD64  /tmp/kubeconform.tgz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/kubeconform.tgz kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Install check-jsonschema
        run: |
          source scripts/lib/tool-versions.sh
          pipx install "check-jsonschema==$CHECK_JSONSCHEMA_VERSION"

      - name: Verify tag matches chart version
        run: |
          chart_version="$(awk '$1 == "version:" {print $2}' platform-library/Chart.yaml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$chart_version" != "$tag_version" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match platform-library/Chart.yaml version ${chart_version}"
            exit 1
          fi
          echo "Releasing platform ${chart_version}"

      - name: Verify CHANGELOG has an entry for this version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## \[${tag_version//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${tag_version}]' heading — add a dated entry before tagging"
            exit 1
          fi
          echo "CHANGELOG.md has an entry for ${tag_version}"

      # Full CI gate — a tag never ships unvalidated code. Same Makefile targets
      # ci.yaml runs, so "it passed CI" and "it passed the release gate" mean
      # the same commands.
      - name: shellcheck
        run: make shellcheck

      - name: helm lint
        run: make helm-lint

      - name: reference values schema is a valid JSON Schema
        run: make schema-meta

      - name: lint-library (render matrix, goldens, kubeconform, negative render, image pins)
        run: make gate

      - name: Log in to GHCR
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin <<<"$GH_TOKEN"

      - name: Package and push chart
        id: push
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(tr '[:upper:]' '[:lower:]' <<<"$OWNER")"  # GHCR paths must be lowercase
          helm package platform-library/ --destination dist/
          if ! push_out=$(helm push "dist/platform-${GITHUB_REF_NAME#v}.tgz" "oci://ghcr.io/${owner}/charts" 2>&1); then
            echo "$push_out"
            echo "::error::helm push failed"
            exit 1
          fi
          echo "$push_out"
          digest="$(grep -oE 'sha256:[0-9a-f]{64}' <<<"$push_out" | head -n1)"
          if [[ -z "$digest" ]]; then
            echo "::error::could not parse a digest from helm push output"
            exit 1
          fi
          echo "chart_ref=ghcr.io/${owner}/charts/platform" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.2"

      # Keyless signing: the OIDC identity (this workflow, on this tag) IS the
      # key — nothing to generate, rotate, or leak. Signs the immutable digest
      # captured above, never the mutable version tag.
      - name: Sign pushed chart digest (keyless OIDC)
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign login ghcr.io --username "$GH_ACTOR" --password "$GH_TOKEN"
          cosign sign --yes "${{ steps.push.outputs.chart_ref }}@${{ steps.push.outputs.digest }}"
