name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint, render matrix, kubeconform, goldens
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Versions and checksums come from scripts/lib/tool-versions.sh — the one
      # place they are declared. Do not inline them here again.
      - name: Install helm
        run: |
          source scripts/lib/tool-versions.sh
          curl -fsSL -o /tmp/helm.tgz "$HELM_URL"
          echo "$HELM_SHA256_LINUX_AMD64  /tmp/helm.tgz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/helm.tgz
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Install kubeconform
        run: |
          source scripts/lib/tool-versions.sh
          curl -fsSL -o /tmp/kubeconform.tgz "$KUBECONFORM_URL"
          echo "$KUBECONFORM_SHA256_LINUX_AMD64  /tmp/kubeconform.tgz" | sha256sum -c -
          tar -xz -C /tmp -f /tmp/kubeconform.tgz kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Install check-jsonschema
        run: |
          source scripts/lib/tool-versions.sh
          pipx install "check-jsonschema==$CHECK_JSONSCHEMA_VERSION"

      # Every step below is a Makefile target, so `make lint` locally runs the
      # exact same commands in the exact same order. Steps stay split out for
      # legible annotations on a red run.
      - name: shellcheck
        run: make shellcheck

      - name: helm lint
        run: make helm-lint

      - name: reference values schema is a valid JSON Schema
        run: make schema-meta

      - name: lint-library (render matrix, goldens, kubeconform, negative render, image pins)
        run: make gate

      - name: consumer scenario (scaffold, build, render, kubeconform)
        run: make smoke

      - name: packaged-artifact consumer scenario (package, build, render, kubeconform)
        run: make smoke-packaged
