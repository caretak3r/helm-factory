{{/*
=============================================================================
platform.rbac — namespaced Role + RoleBinding for the chart's OWN identity
=============================================================================
The library gives every app a dedicated ServiceAccount by default. This block
is how that identity is granted anything: rbac.rules is a plain list of policy
rules, and the RoleBinding subject is wired to platform.serviceAccountName so
it can never drift from the ServiceAccount the pods actually use.

Namespaced only, by design. Cluster-scoped RBAC (ClusterRole/ClusterRoleBinding)
stays in extraObjects behind allowClusterScopedExtras (_util.tpl) — granting
cluster-wide permissions is a deliberate, separately-gated act, not a values
flag on the app's own Role.

Role/RoleBinding are built-in stable Kinds, so this uses apiVersionForOrDefault
and a plain .Values.rbac.enabled gate in _app.yaml (no capability negotiation
to lose — every supported cluster serves rbac.authorization.k8s.io/v1).
Usage: include "platform.rbac" .
*/}}
{{- define "platform.rbac" -}}
{{- if .Values.rbac.enabled -}}
{{- $rules := .Values.rbac.rules | default list -}}
{{- if empty $rules -}}
{{- fail "rbac.enabled=true but rbac.rules is empty. An empty Role grants nothing, so the ServiceAccount stays unable to call the API and the failure only surfaces at runtime as a 403. List the policy rules under rbac.rules, or set rbac.enabled=false." -}}
{{- end -}}
{{- $subject := include "platform.serviceAccountName" . -}}
{{- /* platform.serviceAccountName falls back to "default" when the chart
       neither creates a ServiceAccount nor names one. Binding a Role to that
       SA grants the rules to every pod in the namespace that does not name its
       own identity — a namespace-wide privilege leak from an app-scoped values
       flag. Fail closed. */ -}}
{{- if eq $subject "default" -}}
{{- fail (printf "rbac.enabled=true with serviceAccount.create=false and no serviceAccount.name would bind the Role to the %q namespace's \"default\" ServiceAccount, granting these rules to EVERY pod in that namespace which does not name its own ServiceAccount. Set serviceAccount.create=true (the library default) so the chart owns its identity, or point serviceAccount.name at a dedicated existing ServiceAccount." .Release.Namespace) -}}
{{- end -}}
{{- $name := default (include "platform.fullname" .) .Values.rbac.name -}}
{{- $name = $name | trunc 63 | trimSuffix "-" -}}
{{- $extraLabels := dict -}}
{{- range $k, $v := .Values.commonLabels }}
  {{- $_ := set $extraLabels $k $v -}}
{{- end }}
{{- range $k, $v := .Values.rbac.labels }}
  {{- $_ := set $extraLabels $k $v -}}
{{- end }}
{{- $annotations := dict -}}
{{- range $k, $v := .Values.commonAnnotations }}
  {{- $_ := set $annotations $k $v -}}
{{- end }}
{{- range $k, $v := .Values.rbac.annotations }}
  {{- $_ := set $annotations $k $v -}}
{{- end }}
apiVersion: {{ include "platform.capabilities.apiVersionForOrDefault" (list . "Role") }}
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    {{- range $k, $v := $extraLabels }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  {{- if gt (len $annotations) 0 }}
  annotations:
    {{- range $k, $v := $annotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  {{- end }}
rules: {{- toYaml $rules | nindent 2 }}
---
apiVersion: {{ include "platform.capabilities.apiVersionForOrDefault" (list . "RoleBinding") }}
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    {{- range $k, $v := $extraLabels }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  {{- if gt (len $annotations) 0 }}
  annotations:
    {{- range $k, $v := $annotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $subject }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
