{{- define "platform.daemonset" -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "platform.fullname" . }}
  namespace: {{ .Release.Namespace }}
  {{- include "platform.workloadMetadata" . }}
spec:
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" . | nindent 6 }}
  {{- if .Values.minReadySeconds }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  {{- end }}
  {{- if .Values.daemonSet.updateStrategy }}
  updateStrategy: {{- include "platform.updateStrategy" .Values.daemonSet.updateStrategy | nindent 4 }}
  {{- end }}
  template:
    {{- include "platform.podTemplateSpec" . | nindent 4 }}
{{- end }}

