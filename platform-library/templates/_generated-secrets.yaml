{{/*
=============================================================================
platform.generatedSecrets — cluster-generated credential material.
=============================================================================
One Opaque Secret per entry under .Values.generatedSecrets, named
"<fullname>-gen-<name>". Each key is either random material (kind: password)
or a bcrypt htpasswd line derived from a sibling password key or an inline
plaintext (kind: htpasswd). On upgrade, the existing Secret is looked up and
each requested key is reconciled independently: a key already present in the
live Secret is reused verbatim (its value is already base64 — do NOT
b64enc it again); a key not yet present is generated fresh; a live key no
longer listed under values is dropped, because values are the contract.
`lookup` returns an empty dict under `helm template` / client-side --dry-run,
so offline renders always generate every key fresh — this is why every
rendered Secret here carries the `platform/generated: "true"` annotation:
the lint gate's normalize_render redacts `data:` under it so goldens stay
deterministic. There is no expiry/rotation tracking (unlike tlsSelfSigned) —
rotate by deleting the key (or the whole Secret) and running `helm upgrade`.
*/}}
{{- define "platform.generatedSecrets" -}}
{{- $top := . -}}
{{- if .Values.generatedSecrets }}
{{- $reservedSuffixes := list "-tls" "-ca" "-secret" "-webhook-cert" -}}
{{- $seenNames := dict -}}
{{- range $i, $entry := .Values.generatedSecrets }}
{{- $name := $entry.name | default "" -}}
{{- if not $name -}}
{{- fail (printf "generatedSecrets[%d].name is required." $i) -}}
{{- end -}}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $name) -}}
{{- fail (printf "generatedSecrets[%d].name %q is not a valid DNS-1123 label: lowercase alphanumerics and '-', must start and end alphanumeric." $i $name) -}}
{{- end -}}
{{- if hasKey $seenNames $name -}}
{{- fail (printf "generatedSecrets contains duplicate name %q: entry names must be unique (each becomes Secret %s-gen-%s)." $name (include "platform.fullname" $top) $name) -}}
{{- end -}}
{{- $_ := set $seenNames $name true -}}
{{- $isReserved := false -}}
{{- range $suffix := $reservedSuffixes -}}
{{- if hasSuffix $suffix $name -}}{{- $isReserved = true -}}{{- end -}}
{{- end -}}
{{- if regexMatch "-mtls-client-.*$" $name -}}{{- $isReserved = true -}}{{- end -}}
{{- if $isReserved -}}
{{- fail (printf "generatedSecrets[%d].name %q collides with a reserved release Secret name pattern (-tls, -ca, -secret, -webhook-cert, -mtls-client-*): pick a different name so it cannot be confused with a release-managed Secret." $i $name) -}}
{{- end -}}
{{- $keys := $entry.keys | default list -}}
{{- if not $keys -}}
{{- fail (printf "generatedSecrets[%d] (name %q) has an empty keys list: at least one key is required." $i $name) -}}
{{- end -}}

{{- /* Pass 0: validate every key and index it by name/kind, independent of
       resolution order, so passwordFrom can be checked against the
       DECLARED kind of its target rather than resolution state. */ -}}
{{- $seenKeys := dict -}}
{{- $kindOf := dict -}}
{{- range $j, $k := $keys }}
{{- $keyName := $k.key | default "" -}}
{{- if not $keyName -}}
{{- fail (printf "generatedSecrets[%d].keys[%d].key is required." $i $j) -}}
{{- end -}}
{{- if not (regexMatch "^[A-Za-z0-9._-]+$" $keyName) -}}
{{- fail (printf "generatedSecrets[%d].keys[%d].key %q is not a valid Secret data key: only [A-Za-z0-9._-] are allowed." $i $j $keyName) -}}
{{- end -}}
{{- if hasKey $seenKeys $keyName -}}
{{- fail (printf "generatedSecrets[%d] (name %q) has duplicate key %q." $i $name $keyName) -}}
{{- end -}}
{{- $_ := set $seenKeys $keyName true -}}
{{- $kind := $k.kind | default "" -}}
{{- if not (has $kind (list "password" "htpasswd")) -}}
{{- fail (printf "generatedSecrets[%d].keys[%d] (key %q): unknown kind %q — must be \"password\" or \"htpasswd\"." $i $j $keyName $kind) -}}
{{- end -}}
{{- $_ := set $kindOf $keyName $kind -}}
{{- end }}

{{- $secretName := include "platform.boundedName" (dict "name" (printf "%s-gen-%s" (include "platform.fullname" $top) $name) "kind" "Secret") -}}
{{- $existing := lookup "v1" "Secret" $top.Release.Namespace $secretName -}}
{{- $existingData := dict -}}
{{- if and $existing $existing.data -}}
{{- $existingData = $existing.data -}}
{{- end -}}
{{- $resolved := dict -}}
{{- $freshlyGenerated := dict -}}

{{- /* Pass 1: password kinds first — htpasswd may depend on their plaintext. */ -}}
{{- range $j, $k := $keys }}
{{- $keyName := $k.key -}}
{{- if eq (index $kindOf $keyName) "password" }}
{{- if hasKey $existingData $keyName -}}
{{- /* Value from lookup .data is already base64-encoded — do NOT b64enc. */ -}}
{{- $_ := set $resolved $keyName (index $existingData $keyName) -}}
{{- $_ := set $freshlyGenerated $keyName false -}}
{{- else -}}
{{- $length := $k.length | default 32 | int -}}
{{- $_ := set $resolved $keyName ($length | randAlphaNum | b64enc) -}}
{{- $_ := set $freshlyGenerated $keyName true -}}
{{- end -}}
{{- end }}
{{- end }}

{{- /* Pass 2: htpasswd kinds. A password-kind source that was regenerated
       this render invalidates any reused hash of it — regenerate too. */ -}}
{{- range $j, $k := $keys }}
{{- $keyName := $k.key -}}
{{- if eq (index $kindOf $keyName) "htpasswd" }}
{{- $username := $k.username | default "" -}}
{{- if not $username -}}
{{- fail (printf "generatedSecrets[%d].keys[%d] (key %q, kind htpasswd): username is required." $i $j $keyName) -}}
{{- end -}}
{{- $hasPassword := ne ($k.password | default "") "" -}}
{{- $hasPasswordFrom := ne ($k.passwordFrom | default "") "" -}}
{{- if and $hasPassword $hasPasswordFrom -}}
{{- fail (printf "generatedSecrets[%d].keys[%d] (key %q, kind htpasswd): password and passwordFrom are mutually exclusive — set exactly one." $i $j $keyName) -}}
{{- end -}}
{{- if and (not $hasPassword) (not $hasPasswordFrom) -}}
{{- fail (printf "generatedSecrets[%d].keys[%d] (key %q, kind htpasswd): exactly one of password or passwordFrom is required." $i $j $keyName) -}}
{{- end -}}
{{- $plaintext := "" -}}
{{- $shouldRegenerate := not (hasKey $existingData $keyName) -}}
{{- if $hasPasswordFrom -}}
{{- $src := $k.passwordFrom -}}
{{- if ne (index $kindOf ($src | default "__missing__") | default "") "password" -}}
{{- fail (printf "generatedSecrets[%d].keys[%d] (key %q, kind htpasswd): passwordFrom %q does not name a sibling key of kind \"password\" in the same entry." $i $j $keyName $src) -}}
{{- end -}}
{{- $plaintext = index $resolved $src | b64dec -}}
{{- if index $freshlyGenerated $src -}}
{{- $shouldRegenerate = true -}}
{{- end -}}
{{- else -}}
{{- $plaintext = $k.password -}}
{{- end -}}
{{- if $shouldRegenerate -}}
{{- $_ := set $resolved $keyName ((htpasswd $username $plaintext) | b64enc) -}}
{{- else -}}
{{- /* Value from lookup .data is already base64-encoded — do NOT b64enc. */ -}}
{{- $_ := set $resolved $keyName (index $existingData $keyName) -}}
{{- end -}}
{{- end }}
{{- end }}

{{- if gt $i 0 }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $top.Release.Namespace }}
  labels:
    {{- include "platform.labels" $top | nindent 4 }}
    {{- range $k, $v := $top.Values.commonLabels }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
    {{- range $k, $v := $entry.labels }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  {{- $annotations := dict -}}
  {{- range $k, $v := $top.Values.commonAnnotations }}
    {{- $_ := set $annotations $k $v -}}
  {{- end }}
  {{- range $k, $v := $entry.annotations }}
    {{- $_ := set $annotations $k $v -}}
  {{- end }}
  {{- /* Forced last: the redaction marker must win even if a user-supplied
         annotation key collides with it. */ -}}
  {{- $_ := set $annotations "platform/generated" "true" }}
  annotations:
    {{- range $k, $v := $annotations }}
    {{ $k }}: {{ include "platform.tplValue" (dict "ctx" $top "value" $v) | quote }}
    {{- end }}
type: Opaque
data:
  {{- range $k, $v := $resolved }}
  {{ $k }}: {{ $v }}
  {{- end }}
{{- end }}
{{- end }}
{{- end -}}
