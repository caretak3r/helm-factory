{{- define "platform.mtls" -}}
{{- if .Values.mtls.enabled -}}
{{- $principals := .Values.mtls.allowedPrincipals | default list -}}
{{- if empty $principals -}}
{{- if .Values.mtls.allowAllPrincipals -}}
{{- $principals = list "cluster.local/ns/*/sa/*" -}}
{{- else -}}
{{- fail (printf "mtls.enabled=true but mtls.allowedPrincipals is empty. List the SPIFFE principals allowed to call this workload (same-namespace default: \"cluster.local/ns/%s/sa/*\"), or explicitly opt in to allowing every mesh workload with mtls.allowAllPrincipals=true." .Release.Namespace) -}}
{{- end -}}
{{- end -}}
{{- /* OrDefault is safe for PeerAuthentication: the wrapper gate in _app.yaml
       already proved its availability before this template runs. */}}
apiVersion: {{ include "platform.capabilities.apiVersionForOrDefault" (list . "PeerAuthentication") }}
kind: PeerAuthentication
metadata:
  name: {{ include "platform.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  mtls:
    mode: {{ .Values.mtls.policy }}
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" . | nindent 6 }}
{{- /* AuthorizationPolicy is a SEPARATE CRD from PeerAuthentication. The mtls
       feature is composition: atomic in platform.capabilities.features, so the
       wrapper gate has already proved BOTH APIs and this guard is now
       defense-in-depth: it keeps the per-Kind skip-if-absent doctrine local to
       the emitter should the feature ever be re-declared independent. A skipped
       Kind surfaces in NOTES via the registry's Kind set. */}}
{{- $authzApi := include "platform.capabilities.apiVersionFor" (list . "AuthorizationPolicy") -}}
{{- if $authzApi }}
---
apiVersion: {{ $authzApi }}
kind: AuthorizationPolicy
metadata:
  name: {{ include "platform.boundedName" (dict "name" (printf "%s-authz" (include "platform.fullname" .)) "kind" "AuthorizationPolicy") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        {{- toYaml $principals | nindent 8 }}
{{- end }}
{{- end }}
{{- end }}

