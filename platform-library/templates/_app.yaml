{{- define "platform.app" -}}
{{- if .Values.configMap.enabled }}
{{- include "platform.emit" (include "platform.configmap" .) }}
{{- end }}

{{- if and .Values.jobs.preInstall.enabled (or .Values.jobs.preInstall.script .Values.jobs.preInstall.scriptFile) }}
  {{- $job := dict "type" "preinstall" "script" .Values.jobs.preInstall.script "scriptFile" .Values.jobs.preInstall.scriptFile "hookWeight" .Values.jobs.preInstall.hookWeight -}}
  {{- include "platform.emit" (include "platform.configmap.script" (dict "root" . "job" $job)) }}
{{- end }}

{{- if and .Values.jobs.postInstall.enabled (or .Values.jobs.postInstall.script .Values.jobs.postInstall.scriptFile) }}
  {{- $job := dict "type" "postinstall" "script" .Values.jobs.postInstall.script "scriptFile" .Values.jobs.postInstall.scriptFile -}}
  {{- include "platform.emit" (include "platform.configmap.script" (dict "root" . "job" $job)) }}
{{- end }}

{{- if .Values.secret.enabled }}
{{- include "platform.emit" (include "platform.secret" .) }}
{{- end }}

{{- if .Values.generatedSecrets }}
{{- include "platform.emit" (include "platform.generatedSecrets" .) }}
{{- end }}

{{- if and .Values.certificate.enabled .Values.tlsSelfSigned.enabled -}}
{{- fail (printf "certificate.enabled and tlsSelfSigned.enabled are both true: both target the Secret %q (certificate.secretName defaults to it), so enabling both collides. Set only one to true — certificate.enabled for cert-manager-issued certificates in production, tlsSelfSigned.enabled for local dev/CI self-signed convenience." (include "platform.tlsSecretName" .)) -}}
{{- end }}

{{- /*
tlsSelfSigned.mtls guards. Evaluated unconditionally (not nested under
tlsSelfSigned.enabled) so a misconfiguration fails closed even when
tlsSelfSigned.enabled is false — platform.tls.selfsigned itself never
renders in that case, so these checks would otherwise silently never run.
*/}}
{{- if and .Values.tlsSelfSigned.mtls.enabled (not .Values.tlsSelfSigned.enabled) -}}
{{- fail "tlsSelfSigned.mtls.enabled is true but tlsSelfSigned.enabled is false: mTLS CA/client certificate material is only generated as part of the self-signed TLS flow. Set tlsSelfSigned.enabled: true, or disable tlsSelfSigned.mtls.enabled." -}}
{{- end }}

{{- if .Values.tlsSelfSigned.mtls.enabled -}}
{{- $top := . -}}
{{- if not .Values.tlsSelfSigned.mtls.clients -}}
{{- fail "tlsSelfSigned.mtls.enabled is true but tlsSelfSigned.mtls.clients is empty: at least one client is required, e.g.\n  tlsSelfSigned:\n    mtls:\n      clients:\n        - name: worker" -}}
{{- end -}}
{{- $mtlsReservedSuffixes := list "-tls" "-ca" "-secret" "-webhook-cert" -}}
{{- $mtlsSeenNames := dict -}}
{{- range $i, $client := .Values.tlsSelfSigned.mtls.clients -}}
{{- $cname := $client.name | default "" -}}
{{- if not $cname -}}
{{- fail (printf "tlsSelfSigned.mtls.clients[%d].name is required." $i) -}}
{{- end -}}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $cname) -}}
{{- fail (printf "tlsSelfSigned.mtls.clients[%d].name %q is not a valid DNS-1123 label: lowercase alphanumerics and '-', must start and end alphanumeric." $i $cname) -}}
{{- end -}}
{{- if hasKey $mtlsSeenNames $cname -}}
{{- fail (printf "tlsSelfSigned.mtls.clients contains duplicate name %q: entry names must be unique (each becomes Secret %s-mtls-client-%s)." $cname (include "platform.fullname" $top) $cname) -}}
{{- end -}}
{{- $_ := set $mtlsSeenNames $cname true -}}
{{- range $suffix := $mtlsReservedSuffixes -}}
{{- if hasSuffix $suffix $cname -}}
{{- fail (printf "tlsSelfSigned.mtls.clients[%d].name %q collides with a reserved release Secret name pattern (-tls, -ca, -secret, -webhook-cert): pick a different name." $i $cname) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end }}

{{- if include "platform.capabilities.gateOpen" (list . "Certificate") }}
{{- include "platform.emit" (include "platform.certificate" .) }}
{{- end }}

{{- if and .Values.ingress.enabled .Values.ingress.secrets }}
{{- include "platform.emit" (include "platform.tls.secrets" .) }}
{{- end }}

{{- if .Values.tlsSelfSigned.enabled }}
{{- include "platform.emit" (include "platform.tls.selfsigned" .) }}
{{- end }}

{{- if include "platform.capabilities.gateOpen" (list . "PeerAuthentication") }}
{{- include "platform.emit" (include "platform.mtls" .) }}
{{- end }}

{{- /*
webhooks guards. Nested under webhooks.enabled (unlike the tlsSelfSigned.mtls
guards above, which have their own independent sub-flag) since webhooks has
no separate sub-flag — platform.webhooks itself never renders when disabled,
so these checks would otherwise never run.
*/}}
{{- if .Values.webhooks.enabled -}}
{{- if not .Values.service.enabled -}}
{{- fail (printf "webhooks.enabled is true but service.enabled is false: clientConfig.service on every webhook item targets the release Service %q, which would not exist. Set service.enabled: true, or disable webhooks." (include "platform.fullname" .)) -}}
{{- end -}}
{{- if and (not .Values.webhooks.validating) (not .Values.webhooks.mutating) -}}
{{- fail "webhooks.enabled is true but both webhooks.validating and webhooks.mutating are empty: at least one webhook entry is required, e.g.\n  webhooks:\n    validating:\n      - name: validate.example.com\n        path: /validate\n        rules:\n          - apiGroups: [\"\"]\n            apiVersions: [\"v1\"]\n            operations: [\"CREATE\", \"UPDATE\"]\n            resources: [\"pods\"]" -}}
{{- end -}}
{{- range $i, $entry := .Values.webhooks.validating -}}
{{- if not $entry.name -}}
{{- fail (printf "webhooks.validating[%d].name is required." $i) -}}
{{- end -}}
{{- if not $entry.path -}}
{{- fail (printf "webhooks.validating[%d].path is required." $i) -}}
{{- end -}}
{{- if not $entry.rules -}}
{{- fail (printf "webhooks.validating[%d].rules is required and must be non-empty." $i) -}}
{{- end -}}
{{- end -}}
{{- range $i, $entry := .Values.webhooks.mutating -}}
{{- if not $entry.name -}}
{{- fail (printf "webhooks.mutating[%d].name is required." $i) -}}
{{- end -}}
{{- if not $entry.path -}}
{{- fail (printf "webhooks.mutating[%d].path is required." $i) -}}
{{- end -}}
{{- if not $entry.rules -}}
{{- fail (printf "webhooks.mutating[%d].rules is required and must be non-empty." $i) -}}
{{- end -}}
{{- end -}}
{{- end }}

{{- if .Values.webhooks.enabled }}
{{- include "platform.emit" (include "platform.webhooks" .) }}
{{- end }}

{{- if .Values.persistence.enabled }}
{{- include "platform.emit" (include "platform.pvc" .) }}
{{- end }}

{{- include "platform.emit" (include "platform.workload" .) }}

{{- if .Values.autoscaling.enabled }}
{{- include "platform.emit" (include "platform.hpa" .) }}
{{- end }}

{{- $hpaActsOnCpuMem := or .Values.autoscaling.targetCPU .Values.autoscaling.targetMemory -}}
{{- range .Values.autoscaling.metrics -}}
{{- if and (eq (.type | default "") "Resource") .resource (has (.resource.name | default "") (list "cpu" "memory")) -}}
{{- $hpaActsOnCpuMem = true -}}
{{- end -}}
{{- end -}}
{{- if and .Values.autoscaling.enabled .Values.verticalAutoscaling.enabled (ne .Values.verticalAutoscaling.updateMode "Off") $hpaActsOnCpuMem -}}
{{- fail (printf "autoscaling.enabled (HPA) and verticalAutoscaling.enabled (VPA) are both true, HPA is scaling on CPU/memory, and verticalAutoscaling.updateMode is %q (not \"Off\"): HPA and VPA fighting over the same resource is a known anti-pattern that causes scaling churn. Either disable one, or set verticalAutoscaling.updateMode: Off to run VPA in recommend-only mode alongside HPA." .Values.verticalAutoscaling.updateMode) -}}
{{- end -}}

{{- if include "platform.capabilities.gateOpen" (list . "VerticalPodAutoscaler") }}
{{- include "platform.emit" (include "platform.vpa" .) }}
{{- end }}

{{- if .Values.service.enabled }}
{{- include "platform.emit" (include "platform.service" .) }}
{{- end }}

{{- if include "platform.statefulset.needsManagedHeadless" . }}
{{- include "platform.emit" (include "platform.service.headless" .) }}
{{- end }}

{{- if and .Values.ingress.enabled (not .Values.service.enabled) -}}
{{- fail (printf "ingress.enabled is true but service.enabled is false: every Ingress backend points at the release Service %q, which would not exist, so the Ingress would be accepted but dangling. Set service.enabled: true (Ingress backends target it), or disable the Ingress." (include "platform.fullname" .)) -}}
{{- end }}

{{- if .Values.ingress.enabled }}
{{- include "platform.emit" (include "platform.ingress" .) }}
{{- end }}

{{- if include "platform.capabilities.gateOpen" (list . "HTTPRoute") }}
{{- include "platform.emit" (include "platform.gatewayApi" .) }}
{{- end }}

{{- if .Values.networkPolicy.enabled }}
{{- include "platform.emit" (include "platform.networkpolicy" .) }}
{{- end }}

{{- if .Values.podDisruptionBudget.enabled }}
{{- include "platform.emit" (include "platform.pdb" .) }}
{{- end }}

{{- if .Values.resourceQuota.enabled }}
{{- include "platform.emit" (include "platform.resourcequota" .) }}
{{- end }}

{{- if .Values.limitRange.enabled }}
{{- include "platform.emit" (include "platform.limitrange" .) }}
{{- end }}

{{- if .Values.serviceAccount.create }}
{{- include "platform.emit" (include "platform.serviceAccount" .) }}
{{- end }}

{{- if and .Values.serviceAccount.create .Values.jobs.preInstall.enabled }}
{{- include "platform.emit" (include "platform.serviceAccount.hook" .) }}
{{- end }}

{{- if .Values.rbac.enabled }}
{{- include "platform.emit" (include "platform.rbac" .) }}
{{- end }}

{{- if include "platform.capabilities.gateOpen" (list . "ServiceMonitor") }}
{{- include "platform.emit" (include "platform.servicemonitor" .) }}
{{- end }}

{{- if include "platform.capabilities.gateOpen" (list . "PodMonitor") }}
{{- include "platform.emit" (include "platform.podmonitor" .) }}
{{- end }}

{{- if include "platform.capabilities.gateOpen" (list . "PrometheusRule") }}
{{- include "platform.emit" (include "platform.prometheusrule" .) }}
{{- end }}

{{- if .Values.cronJob.enabled }}
{{- include "platform.emit" (include "platform.cronjob" .) }}
{{- end }}

{{- if .Values.jobs.preInstall.enabled }}
{{- include "platform.emit" (include "platform.job.preinstall" .) }}
{{- end }}

{{- if .Values.jobs.postInstall.enabled }}
{{- include "platform.emit" (include "platform.job.postinstall" .) }}
{{- end }}
{{- end }}

{{/*
=============================================================================
platform.render — the single public entrypoint a consuming chart includes.
Composes the opinionated "primary app" objects (platform.app) with the
generic capability-gated long-tail (extraObjects) and the raw escape hatch
(extraManifests). A consumer's templates/app.yaml is simply:
  {{ include "platform.render" . }}
=============================================================================
*/}}
{{- define "platform.render" -}}
{{- include "platform.app" . }}
{{- include "platform.extraObjects" . }}
{{- include "platform.extraManifests" . }}
{{- end -}}
