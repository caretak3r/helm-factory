{{- define "platform.prometheusrule" -}}
{{- if .Values.prometheusRule.enabled }}
{{- if not .Values.prometheusRule.groups }}
{{- fail "prometheusRule.enabled is true but prometheusRule.groups is empty: a PrometheusRule with no groups enforces nothing. Define at least one group with alerting or recording rules." }}
{{- end }}
apiVersion: {{ include "platform.capabilities.apiVersionForOrDefault" (list . "PrometheusRule") }}
kind: PrometheusRule
metadata:
  name: {{ include "platform.fullname" . }}
  namespace: {{ default .Release.Namespace .Values.prometheusRule.namespace }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    {{- range $k, $v := .Values.prometheusRule.labels }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  {{- if or .Values.commonAnnotations .Values.prometheusRule.annotations }}
  annotations:
    {{- $annotations := dict -}}
    {{- range $k, $v := .Values.commonAnnotations }}
    {{- $_ := set $annotations $k $v -}}
    {{- end }}
    {{- range $k, $v := .Values.prometheusRule.annotations }}
    {{- $_ := set $annotations $k $v -}}
    {{- end }}
    {{- range $k, $v := $annotations }}
    {{ $k }}: {{ include "platform.tplValue" (dict "ctx" $ "value" $v) | quote }}
    {{- end }}
  {{- end }}
spec:
  groups:
    {{- toYaml .Values.prometheusRule.groups | nindent 4 }}
{{- end }}
{{- end }}
